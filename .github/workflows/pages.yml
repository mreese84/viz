# Build the site and publish it to GitHub Pages.
#
# dist/ is not committed: every run builds it with scripts/assemble.py.
# - Pull requests: build (and run the checks) only.
# - Pushes to main (and manual runs on main): build, then deploy dist/ to GitHub Pages.
#   This includes commits made by the gallery's "Add poster" page.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deployment finish rather than cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tests
        run: |
          python3 tests/test_suggestions.py
          python3 tests/parity/check.py   # browser (JS) and Python ride maths must agree

      - name: Assemble dist/
        run: python3 scripts/assemble.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
