<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Posters</title>
<meta name="description" content="An experiment in turning cycling data into bespoke artwork.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --page:#141317; --card:#1c1b20; --line:rgba(255,255,255,.1); --text:#f3eff0; --muted:#a39ea1; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page); color:var(--text); font-family:Barlow, system-ui, sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:56px 20px 64px; }
  header { margin-bottom:36px; }
  h1 { font-family:'Bodoni Moda', Didot, Georgia, serif; font-weight:400; font-size:44px; line-height:1.1; margin:0 0 10px; }
  header p { color:var(--muted); font-size:16px; margin:0; max-width:36em; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:24px; }
  .card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden;
          color:inherit; text-decoration:none; transition:transform .15s, border-color .15s; }
  .card:hover, .card:focus-visible { transform:translateY(-2px); border-color:rgba(255,255,255,.28); }
  .card svg { display:block; width:100%; height:auto; aspect-ratio:1; }
  .meta { padding:16px 18px 20px; }
  h2 { font-family:'Bodoni Moda', Didot, Georgia, serif; font-weight:400; font-size:23px; margin:0 0 8px; }
  .when, .stats { font-family:'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:13px; color:var(--muted); margin:0 0 3px; }
  .summary { font-size:14px; line-height:1.5; color:var(--text); opacity:.85; margin:10px 0 0; }
  @media (max-width:600px) { .wrap { padding:32px 16px 48px; } h1 { font-size:34px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ride Posters</h1>
    <p>An experiment in turning cycling data into bespoke artwork: each trip drawn as one circular elevation profile, ride after ride.</p>
  </header>
  <main class="grid">
<!--__CARDS__-->
  </main>
</div>
</body>
</html>
